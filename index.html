<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>LogTime</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f7f6f2;
            --bg-card: #faf9f6;
            --text: #2d2d2d;
            --text-light: #5a5a5a;
            --text-muted: #b5b5b5;
            --border: #e8e6e0;
            --blue: #5a8a9e;
            --blue-light: #7aaabc;
            --blue-pale: #d9e6ed;
            --gray: #d0cec8;
            --gray-light: #eae8e2;
            --radius: 4px;
            --font: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
            --ring-size: 220px;
            --grid-gap: 2px;
            --grid-cols: 20;
            --grid-rows: 10;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray);
            border-radius: 2px;
        }

        .hidden {
            display: none !important;
        }

        .icon-button {
            background: none;
            border: none;
            font-size: 1.2rem;
            padding: 4px 6px;
            cursor: pointer;
            color: var(--text-light);
            border-radius: var(--radius);
            transition: background 0.15s, color 0.15s;
            line-height: 1;
        }
        .icon-button:hover {
            background: var(--gray-light);
            color: var(--text);
        }

        #app {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 20px 32px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 64px;
            z-index: 10;
        }

        .task-info {
            flex: 1;
            min-width: 0;
            padding-right: 12px;
        }

        .task-name-wrap {
            position: relative;
            margin-bottom: 2px;
        }

        .task-name-display {
            font-size: 1.15rem;
            font-weight: 450;
            color: var(--text);
            word-break: break-word;
            padding: 4px 6px;
            min-height: 2rem;
            border: none;
            background: transparent;
            width: 100%;
            font-family: var(--font);
            border-radius: 4px;
            margin-left: -6px;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
            outline: none;
            transition: background 0.15s;
        }
        .task-name-display:hover {
            background: rgba(90, 138, 158, 0.08);
        }
        .task-name-display.empty {
            color: var(--text-muted);
            font-weight: 350;
        }

        .task-name-input {
            font-size: 1.15rem;
            font-weight: 450;
            color: var(--text);
            padding: 4px 6px;
            min-height: 2rem;
            border: none;
            background: rgba(90, 138, 158, 0.08);
            width: 100%;
            font-family: var(--font);
            border-radius: 4px;
            margin-left: -6px;
            outline: 1px solid var(--blue-pale);
            box-shadow: 0 0 0 2px rgba(90, 138, 158, 0.05);
        }
        .task-name-input:focus {
            outline: 1px solid var(--blue-light);
            box-shadow: 0 0 0 3px rgba(90, 138, 158, 0.08);
        }

        .task-duration {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 350;
            letter-spacing: 0.02em;
            padding-left: 6px;
            transition: opacity 0.4s ease;
        }

        .top-menu {
            flex-shrink: 0;
            padding-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-menu .icon-button {
            font-size: 1.4rem;
            padding: 2px 6px;
        }
        .top-menu .info-button {
            font-size: 1.2rem;
            padding: 2px 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            border-radius: var(--radius);
            transition: background 0.15s, color 0.15s;
            line-height: 1;
            font-family: var(--font);
        }
        .top-menu .info-button:hover {
            background: var(--gray-light);
            color: var(--text);
        }

        .main-visual {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 0 16px;
            min-height: 360px;
            position: relative;
            transition: opacity 0.4s ease;
        }
        .main-visual.paused-state {
            opacity: 0.55;
        }
        .main-visual.paused-state .ring-container::after {
            content: '⏸';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4rem;
            color: var(--text-light);
            opacity: 0.5;
            pointer-events: none;
            z-index: 10;
        }
        .main-visual.paused-state .grid-container {
            opacity: 0.55;
        }

        .ring-container {
            position: relative;
            width: var(--ring-size);
            height: var(--ring-size);
            flex-shrink: 0;
        }
        #ringCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
        }

        .percent-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        .percent-wrap.fade-out {
            opacity: 0;
        }

        .percent-tag {
            position: absolute;
            bottom: -4px;
            right: -4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            pointer-events: none;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 2px;
            user-select: none;
            font-weight: 380;
            z-index: 2;
            transition: all 0.9s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .percent-tag.completed-centered {
            bottom: 50% !important;
            right: 50% !important;
            transform: translate(50%, 50%) !important;
            font-size: clamp(2.6rem, 7vw, 4rem) !important;
            color: var(--text) !important;
            opacity: 0.92 !important;
            font-weight: 450;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px rgba(90, 138, 158, 0.08);
            padding: 0 12px;
            border-radius: 8px;
            line-height: 1.3;
            width: auto;
            height: auto;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .grid-container {
            display: none;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 20 / 10;
            padding: 4px 0;
            flex-shrink: 0;
            transition: opacity 0.4s ease;
            position: relative;
        }
        .grid-container.active {
            display: block;
        }
        .grid-inner {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: var(--grid-gap);
            width: 100%;
            height: 100%;
        }
        .grid-cell {
            background: var(--gray-light);
            border-radius: 1px;
            transition: background 0.25s ease;
            aspect-ratio: 1 / 1;
        }
        .grid-cell.filled {
            background: var(--blue);
        }
        .grid-cell.filled.completed {
            background: var(--blue);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 80px 0 0 0;
            color: var(--text-light);
            flex: 1;
            width: 100%;
        }
        .empty-state .add-trigger {
            font-size: 2.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
            background: none;
            border: none;
            padding: 12px;
            line-height: 1;
        }
        .empty-state .add-trigger:hover {
            color: var(--text);
            transform: scale(1.04);
        }
        .empty-state .empty-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .empty-footer {
            margin-top: auto;
            margin-bottom: -10px;
            padding-top: 20px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            opacity: 0.5;
            user-select: none;
        }

        .bottom-controls {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-top: auto;
            z-index: 10;
            position: relative;
        }

        .real-time-toggle {
            font-size: 0.8rem;
            color: var(--text-light);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: var(--radius);
            transition: background 0.15s;
            background: none;
            border: none;
            font-family: var(--font);
        }
        .real-time-toggle:hover {
            background: var(--gray-light);
            color: var(--text);
        }
        .real-time-toggle .caret {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.6rem;
            margin-left: 2px;
        }
        .real-time-toggle .caret.open {
            transform: rotate(180deg);
        }

        .real-time-display {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            padding: 2px 0 2px 8px;
            opacity: 0;
            transition: opacity 0.25s, max-height 0.25s;
            max-height: 0;
            overflow: hidden;
            width: 100%;
            text-align: right;
            letter-spacing: 0.02em;
        }
        .real-time-display.visible {
            opacity: 1;
            max-height: 30px;
        }
        .real-time-display .label {
            color: var(--text-muted);
        }
        .real-time-display .value {
            color: var(--text-light);
            font-weight: 400;
        }

        .pause-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px 18px;
            font-size: 0.85rem;
            color: var(--text-light);
            cursor: pointer;
            font-family: var(--font);
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            letter-spacing: 0.04em;
            min-width: 64px;
            text-align: center;
        }
        .pause-btn:hover {
            background: var(--gray-light);
            border-color: var(--gray);
            color: var(--text);
        }
        .pause-btn:active {
            background: var(--border);
        }
        .pause-btn.running {
            color: var(--text);
            border-color: var(--gray);
        }
        .pause-btn.paused {
            color: var(--text-light);
            border-color: var(--border);
        }
        .pause-btn.reset-btn {
            color: var(--text-muted);
            border-color: var(--border);
        }
        .pause-btn.reset-btn:hover {
            color: #c0392b;
            border-color: #c0392b;
            background: rgba(192, 57, 43, 0.04);
        }

        .bottom-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .bottom-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 20px 18px;
            margin-bottom: 20px;
            flex-shrink: 0;
            display: none;
            animation: fadeSlide 0.25s ease;
            z-index: 20;
            position: relative;
        }
        .add-panel.open {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .add-panel .panel-title {
            font-size: 0.9rem;
            font-weight: 450;
            color: var(--text);
            margin-bottom: 14px;
            letter-spacing: 0.02em;
        }

        .add-field {
            margin-bottom: 14px;
        }
        .add-field label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }
        .add-field input,
        .add-field select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 0.95rem;
            font-family: var(--font);
            color: var(--text);
            transition: border-color 0.15s, background 0.15s;
            outline: none;
        }
        .add-field input:focus,
        .add-field select:focus {
            border-color: var(--blue-light);
            background: #ffffff;
        }
        .add-field input::placeholder {
            color: var(--text-muted);
        }

        .mode-selection {
            margin-bottom: 16px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: opacity 0.3s ease, pointer-events 0.3s ease;
        }
        .mode-selection.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .mode-selection .mode-label {
            font-size: 0.78rem;
            color: var(--text-light);
            letter-spacing: 0.03em;
            margin-bottom: 6px;
        }
        .mode-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 0;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
        }
        .mode-option input[type="radio"] {
            margin: 0;
            accent-color: var(--blue);
            flex-shrink: 0;
        }

        .add-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .add-row .add-field {
            flex: 1;
            margin-bottom: 0;
        }
        .add-row .add-field:first-child {
            flex: 2;
        }
        .add-row .add-field:last-child {
            flex: 1;
        }

        .add-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .add-actions .btn {
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 0.85rem;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            color: var(--text-light);
        }
        .add-actions .btn:hover {
            background: var(--gray-light);
            border-color: var(--gray);
            color: var(--text);
        }
        .add-actions .btn-primary {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;
        }
        .add-actions .btn-primary:hover {
            background: var(--blue-light);
            border-color: var(--blue-light);
            color: #fff;
        }
        .add-actions .btn-primary:active {
            background: #4a7a8e;
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.06);
            z-index: 100;
            display: none;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 20px 16px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .menu-overlay.open {
            display: flex;
        }

        .menu-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 18px 18px;
            min-width: 180px;
            max-width: 260px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.03);
            animation: fadeSlide 0.2s ease;
        }
        .menu-panel .menu-close {
            float: right;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }
        .menu-panel .menu-close:hover {
            color: var(--text);
        }

        .menu-section {
            margin-bottom: 16px;
        }
        .menu-section:last-child {
            margin-bottom: 0;
        }
        .menu-section .menu-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 450;
        }
        .menu-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-light);
            transition: color 0.15s;
        }
        .menu-option:hover {
            color: var(--text);
        }
        .menu-option .radio {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--border);
            position: relative;
            flex-shrink: 0;
            transition: border-color 0.15s;
        }
        .menu-option .radio.active {
            border-color: var(--blue);
        }
        .menu-option .radio.active::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--blue);
        }

        .menu-about {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .menu-about .menu-option {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .menu-about .menu-option.danger {
            color: #c0392b;
        }
        .menu-about .menu-option.danger:hover {
            color: #a93226;
        }

        /* ===== 合并弹窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.06);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: #fcfbf9;
            border: 1px solid rgba(232, 230, 224, 0.5);
            border-radius: 14px;
            padding: 32px 28px 28px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: fadeSlide 0.3s ease;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.04);
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 430;
            color: var(--text);
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .modal-intro {
            font-size: 0.92rem;
            color: var(--text-light);
            line-height: 1.8;
            margin-bottom: 18px;
        }
        .modal-intro p {
            margin-bottom: 6px;
        }
        .modal-intro p:last-child {
            margin-bottom: 0;
        }

        .modal-intro .highlight {
            color: var(--text);
        }

        /* ---- 模式卡片 ---- */
        .mode-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .mode-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px 14px;
        }

        .mode-card-header {
            font-size: 0.82rem;
            font-weight: 430;
            color: var(--text);
            letter-spacing: 0.02em;
            margin-bottom: 2px;
        }
        .mode-card-header .mode-badge {
            font-weight: 380;
            color: var(--text-light);
            margin-right: 2px;
        }

        .mode-card-formula {
            font-family: "Times New Roman", "STIX", "Georgia", serif;
            font-style: italic;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: 0.03em;
            padding: 2px 0;
            text-align: left;
        }

        .modal-theory {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.7;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            margin-bottom: 2px;
        }
        .modal-theory strong {
            color: var(--text);
            font-weight: 480;
        }

        .modal-closing {
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.6;
            margin-top: 10px;
        }

        .modal-version {
            text-align: right;
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            opacity: 0.35;
            margin-top: 10px;
            user-select: none;
        }

        .modal-close {
            margin-top: 16px;
            text-align: right;
        }
        .modal-close button {
            background: none;
            border: none;
            padding: 4px 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--font);
            transition: color 0.15s;
            letter-spacing: 0.04em;
        }
        .modal-close button:hover {
            color: var(--text);
        }

        .burst-emoji {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            font-weight: 400;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            animation: burstAndSettle 1.8s cubic-bezier(0.08, 0.82, 0.17, 1) forwards;
            user-select: none;
            will-change: transform, opacity;
        }

        @keyframes burstAndSettle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            35% {
                opacity: 0.95;
                transform: translate(calc(var(--tx) * 0.3), calc(var(--ty) * 0.3)) scale(0.9) rotate(180deg);
            }
            100% {
                opacity: var(--final-opacity, 0.45);
                transform: translate(var(--tx), var(--ty)) scale(var(--final-scale, 0.35)) rotate(720deg);
            }
        }

        .capture-mode .grid-cell {
            transition: none !important;
        }
        .capture-mode #ringCanvas {
            transition: none !important;
        }
        .capture-mode .main-visual.paused-state {

        .capture-mode .main-visual.paused-state .ring-container::after {

<body>
    <div id="app">
        <header class="top-bar">
            <div class="task-info">
                <div class="task-name-wrap" id="taskNameWrap">
                    <div id="taskNameDisplay" class="task-name-display empty">未命名任务</div>

            <div class="top-menu">

        <div id="addPanel" class="add-panel">
            <div class="panel-title">+ 添加任务</div>
            <div class="add-field">
                <label for="taskNameInputField">任务名称</label>
                <input type="text" id="taskNameInputField" placeholder="阶段复习，还是别的什么呢？" maxlength="60" />
            </div>
            <div class="add-row">
                <div class="add-field">
                    <label for="durationInput">时长</label>
                    <input type="number" id="durationInput" placeholder="例如：2" min="0.5" step="0.5" value="1" />

                <div class="add-field">
                    <label for="unitSelect">单位</label>
                    <select id="unitSelect">
                        <option value="minutes">分钟</option>
                        <option value="hours" selected>小时</option>
                        <option value="days">天</option>
                        <option value="weeks">周</option>
                    </select>
                </div>
            </div>

            <div class="mode-selection" id="modeSelection">
                <div class="mode-label">时间反馈模式</div>
                <label class="mode-option">
                    <input type="radio" name="mode" value="A" checked />
                    适合长周期任务
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="B" />
                    适合短时间任务
                </label>
            </div>

            <div class="add-actions">
                <button class="btn" id="cancelAddBtn">取消</button>

        <div class="main-visual" id="mainVisual">
            <div id="emptyState" class="empty-state">

            <div id="ringContainer" class="ring-container hidden">
                <canvas id="ringCanvas" width="400" height="400"></canvas>
                <div class="percent-wrap" id="percentWrap"></div>
                <div class="percent-tag" id="percentTag">
                    <span id="percentText">0.0%</span>

            <div id="gridContainer" class="grid-container">

        <div class="bottom-controls">
            <div class="bottom-left">
                <button class="real-time-toggle" id="realTimeToggle">
                    实际 <span class="caret" id="caretIcon">›</span>
                </button>
                <div id="realTimeDisplay" class="real-time-display">
                    <span class="label">实际 · </span>
                    <span class="value" id="realTimeValue">0.0%</span>

            <div class="bottom-right">
                <button class="pause-btn" id="pauseBtn">暂停</button>

    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-panel">
            <button class="menu-close" id="menuClose">✕</button>
            <div class="menu-section">
                <div class="menu-label">显示方式</div>
                <div class="menu-option" data-mode="ring">
                    <span class="radio active" id="modeRingRadio"></span> 圆环
                </div>
                <div class="menu-option" data-mode="grid">
                    <span class="radio" id="modeGridRadio"></span> 方格
                </div>
            </div>
            <div class="menu-about">
                <div class="menu-option" id="captureMenuBtn" style="margin-top:4px;">
                    <span style="font-size:0.9rem;">🖼</span> 生成图片
                </div>
                <div class="menu-option danger" id="resetTaskBtn" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:#c0392b;">
                    <span style="font-size:0.9rem;">⟳</span> 重置任务
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 合并弹窗 - 文案已按要求修改 ===== -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <div class="modal-title">关于 LogTime</div>

            <div class="modal-intro">
                <p>人对时间的感受并不均匀</p>
                <p>同样的一分钟，在任务开始和结束时，心理重量可能不同</p>
                <p class="highlight"><strong>LogTime 让时间的视觉呈现转为非线性</strong><br />用视觉的快慢，平衡感知的快慢</p>
            </div>

            <div class="mode-cards">
                <div class="mode-card">
                    <div class="mode-card-header">
                        <span class="mode-badge">A</span> · 适合长周期任务
                    </div>
                    <div class="mode-card-formula">
                        P<sub>A</sub>(x) = ln(1 + 2x) / ln&thinsp;3
                    </div>
                </div>

                <div class="mode-card">
                    <div class="mode-card-header">
                        <span class="mode-badge">B</span> · 适合短时间任务
                    </div>
                    <div class="mode-card-formula">
                        P<sub>B</sub>(x) = x²
                    </div>
                </div>
            </div>

            <div class="modal-theory">
                参考 <strong>韦伯–费希纳定律</strong> 中刺激与感知之间的对数关系
            </div>

            <p class="modal-closing">真实时间没有改变，改变的是我们看见它的方式</p>

            <div class="modal-version">v1.0 · 2026</div>

            <div class="modal-close">
                <button id="infoCloseBtn">关闭</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ===== 配置 =====
            const CONFIG = {
                MATH_A: 2.0,
                GRID_COLS: 20,
                GRID_ROWS: 10,
                UPDATE_INTERVAL: 80,
                STORAGE_KEY: 'time_app_state_v1',
            };

            // ===== 状态 =====
            const state = {
                taskName: '',
                totalDuration: 0,
                elapsed: 0,
                isPaused: true,
                isCompleted: false,
                startTimestamp: null,
                accumulatedElapsed: 0,
                pauseTimestamp: null,
                mode: 'ring',
                showRealTime: false,
                isInitialized: false,
                feedbackMode: 'A',
                isModeLocked: false,
            };

            // ===== 数学模型 =====
            function calculatePerceivedProgress(x, a) {
                a = a ?? CONFIG.MATH_A;
                if (x <= 0) return 0;
                if (x >= 1) return 1;

                if (state.feedbackMode === 'B') {
                    return x * x;
                }

                return Math.log(1 + a * x) / Math.log(1 + a);
            }

            // ===== DOM 引用 =====
            const $ = id => document.getElementById(id);
            const dom = {
                app: $('app'),
                taskNameDisplay: $('taskNameDisplay'),
                taskNameInput: $('taskNameInput'),
                taskNameWrap: $('taskNameWrap'),
                taskDurationDisplay: $('taskDurationDisplay'),
                menuBtn: $('menuBtn'),
                menuOverlay: $('menuOverlay'),
                menuClose: $('menuClose'),
                addPanel: $('addPanel'),
                taskNameInputField: $('taskNameInputField'),
                durationInput: $('durationInput'),
                unitSelect: $('unitSelect'),
                cancelAddBtn: $('cancelAddBtn'),
                startNowBtn: $('startNowBtn'),
                emptyState: $('emptyState'),
                emptyAddBtn: $('emptyAddBtn'),
                ringContainer: $('ringContainer'),
                ringCanvas: $('ringCanvas'),
                percentWrap: $('percentWrap'),
                percentTag: $('percentTag'),
                percentText: $('percentText'),
                gridContainer: $('gridContainer'),
                gridInner: $('gridInner'),
                realTimeToggle: $('realTimeToggle'),
                realTimeDisplay: $('realTimeDisplay'),
                realTimeValue: $('realTimeValue'),
                caretIcon: $('caretIcon'),
                pauseBtn: $('pauseBtn'),
                captureMenuBtn: $('captureMenuBtn'),
                resetTaskBtn: $('resetTaskBtn'),
                mainVisual: $('mainVisual'),
                modeRingRadio: $('modeRingRadio'),
                modeGridRadio: $('modeGridRadio'),
                modeSelection: $('modeSelection'),
                modeRadios: document.querySelectorAll('input[name="mode"]'),
                infoBtn: $('infoBtn'),
                infoModal: $('infoModal'),
                infoCloseBtn: $('infoCloseBtn'),
            };

            // ===== 任务名称编辑 =====
            let isEditing = false;

            function enableTaskNameEdit() {
                if (state.totalDuration <= 0) return;
                if (isEditing) return;

                isEditing = true;
                dom.taskNameInput.value = state.taskName || '';
                dom.taskNameDisplay.classList.add('hidden');
                dom.taskNameInput.classList.remove('hidden');
                dom.taskNameInput.focus();

                var len = dom.taskNameInput.value.length;
                dom.taskNameInput.setSelectionRange(len, len);
            }

            function disableTaskNameEdit(save) {
                if (!isEditing) return;
                isEditing = false;

                dom.taskNameInput.classList.add('hidden');
                dom.taskNameDisplay.classList.remove('hidden');

                if (save !== false) {
                    const newName = dom.taskNameInput.value.trim() || '未命名任务';
                    state.taskName = newName;
                    updateTaskInfoDisplay();
                    saveState();
                } else {
                    updateTaskInfoDisplay();
                }
            }

            // ===== 绘图 =====
            function drawRing(progress) {
                const canvas = dom.ringCanvas;
                const rect = canvas.parentElement.getBoundingClientRect();
                const size = Math.min(rect.width || 400, rect.height || 400);
                const dpr = window.devicePixelRatio || 1;
                const logicalSize = Math.min(size, 400);
                canvas.width = logicalSize * dpr;
                canvas.height = logicalSize * dpr;
                canvas.style.width = logicalSize + 'px';
                canvas.style.height = logicalSize + 'px';

                const ctx = canvas.getContext('2d');
                const w = canvas.width,
                    h = canvas.height;
                const cx = w / 2,
                    cy = h / 2;
                const radius = Math.min(w, h) * 0.5 * 0.82;
                const lineWidth = Math.max(12, radius * 0.18);

                ctx.clearRect(0, 0, w, h);

                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#eae8e2';
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.stroke();

                const clamped = Math.min(Math.max(progress, 0), 1);
                const startAngle = -Math.PI / 2;
                const endAngle = startAngle + Math.PI * 2 * clamped;

                ctx.beginPath();
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.strokeStyle = '#5a8a9e';
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.stroke();

                if (clamped >= 1) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#5a8a9e';
                    ctx.lineWidth = lineWidth * 0.3;
                    ctx.globalAlpha = 0.15;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }

            function buildGrid() {
                dom.gridInner.innerHTML = '';
                const total = CONFIG.GRID_COLS * CONFIG.GRID_ROWS;
                for (let i = 0; i < total; i++) {
                    const d = document.createElement('div');
                    d.className = 'grid-cell';
                    dom.gridInner.appendChild(d);
                }
            }

            function updateGrid(progress) {
                const cells = dom.gridInner.querySelectorAll('.grid-cell');
                const total = cells.length;
                const filled = Math.round(progress * total);
                const clamped = Math.min(Math.max(filled, 0), total);
                cells.forEach((c, i) => {
                    if (i < clamped) c.classList.add('filled');
                    else c.classList.remove('filled');
                });
            }

            // ===== 核心更新 =====
            let updateTimer = null;
            let isUpdating = false;

            function updateTime() {
                if (isUpdating) return;
                isUpdating = true;
                try {
                    if (!state.isCompleted && !state.isPaused && state.startTimestamp !== null) {
                        const now = Date.now();
                        const delta = (now - state.startTimestamp) / 1000;
                        const newElapsed = state.accumulatedElapsed + delta;
                        if (newElapsed >= state.totalDuration) {
                            state.elapsed = state.totalDuration;
                            state.isCompleted = true;
                            state.isPaused = true;
                            state.startTimestamp = null;
                            onComplete();
                        } else {
                            state.elapsed = newElapsed;
                        }
                    }

                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    renderAll(x, p);

                    if (state.isCompleted && updateTimer) {
                        clearInterval(updateTimer);
                        updateTimer = null;
                    }
                } catch (e) { console.warn(e); } finally { isUpdating = false; }
            }

            function formatPercent(v) {
                v = Math.min(Math.max(v, 0), 1);
                return (v * 100).toFixed(1) + '%';
            }

            function renderAll(x, p) {
                drawRing(p);
                updateGrid(p);
                dom.percentText.textContent = formatPercent(p);
                dom.realTimeValue.textContent = formatPercent(x);
                updateTaskInfoDisplay();
                updatePauseButton();
                updateRealTimeVisibility();
                updatePauseVisual();
            }

            function formatDuration(s) {
                if (s <= 0) return '—';
                const mins = s / 60;
                const hours = mins / 60;
                const days = hours / 24;
                const weeks = days / 7;
                if (weeks >= 1 && Number.isInteger(weeks)) return weeks + ' 周';
                if (days >= 1 && Number.isInteger(days)) return days + ' 天';
                if (hours >= 1 && Number.isInteger(hours)) return hours + ' 小时';
                if (mins >= 1 && Number.isInteger(mins)) return mins + ' 分钟';
                return Math.round(s) + ' 秒';
            }

            function updateTaskInfoDisplay() {
                if (isEditing) {
                    dom.taskDurationDisplay.textContent = state.totalDuration > 0 ? formatDuration(state.totalDuration) :
                        '—';
                    return;
                }
                const name = state.taskName.trim() || '未命名任务';
                dom.taskNameDisplay.textContent = name;
                dom.taskNameDisplay.classList.toggle('empty', !state.taskName.trim());
                dom.taskDurationDisplay.textContent = state.totalDuration > 0 ? formatDuration(state.totalDuration) : '—';
            }

            function updatePauseButton() {
                if (state.isCompleted) {
                    dom.pauseBtn.textContent = '重置';
                    dom.pauseBtn.classList.remove('running', 'paused');
                    dom.pauseBtn.classList.add('reset-btn');
                    dom.pauseBtn.disabled = false;
                    return;
                }
                dom.pauseBtn.classList.remove('reset-btn');
                dom.pauseBtn.disabled = false;
                if (state.isPaused) {
                    dom.pauseBtn.textContent = '继续';
                    dom.pauseBtn.classList.add('paused');
                    dom.pauseBtn.classList.remove('running');
                } else {
                    dom.pauseBtn.textContent = '暂停';
                    dom.pauseBtn.classList.add('running');
                    dom.pauseBtn.classList.remove('paused');
                }
            }

            function updatePauseVisual() {
                dom.mainVisual.classList.toggle('paused-state', !state.isCompleted && state.isPaused);
            }

            function updateRealTimeVisibility() {
                dom.realTimeDisplay.classList.toggle('visible', state.showRealTime);
                dom.caretIcon.classList.toggle('open', state.showRealTime);
            }

            // ===== 模式切换 =====
            function setMode(mode) {
                if (mode === state.mode) return;
                state.mode = mode;

                if (mode === 'ring') {
                    dom.ringContainer.classList.remove('hidden');
                    dom.gridContainer.classList.remove('active');
                    dom.gridContainer.style.display = 'none';
                    dom.percentTag.style.display = 'flex';
                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    drawRing(p);
                } else {
                    dom.ringContainer.classList.add('hidden');
                    dom.gridContainer.style.display = 'block';
                    dom.gridContainer.classList.add('active');
                    dom.percentTag.style.display = 'none';
                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    updateGrid(p);
                }

                document.querySelectorAll('.menu-option[data-mode] .radio').forEach(el => el.classList.remove('active'));
                if (mode === 'ring') dom.modeRingRadio.classList.add('active');
                else dom.modeGridRadio.classList.add('active');
                saveState();
            }

            // ===== 暂停/继续 =====
            function togglePause() {
                if (state.isCompleted) { resetTask(); return; }
                if (state.totalDuration <= 0) return;

                if (state.isPaused) {
                    state.isPaused = false;
                    state.startTimestamp = Date.now();
                    state.pauseTimestamp = null;
                    startTimer();
                } else {
                    state.isPaused = true;
                    if (state.startTimestamp !== null) {
                        const now = Date.now();
                        state.accumulatedElapsed += (now - state.startTimestamp) / 1000;
                        state.elapsed = state.accumulatedElapsed;
                        state.startTimestamp = null;
                    }
                    state.pauseTimestamp = Date.now();
                    if (updateTimer) { clearInterval(updateTimer);
                        updateTimer = null; }
                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    renderAll(x, p);
                }
                updatePauseButton();
                updatePauseVisual();
                saveState();
            }

            function startTimer() {
                if (updateTimer) clearInterval(updateTimer);
                if (state.isPaused || state.isCompleted) return;
                if (!state.startTimestamp) state.startTimestamp = Date.now();
                updateTimer = setInterval(updateTime, CONFIG.UPDATE_INTERVAL);
                updateTime();
            }

            // ===== 完成 =====
            let burstTimeout = null;

            function triggerCelebrationBurst() {
                document.querySelectorAll('.burst-emoji').forEach(el => el.remove());
                if (burstTimeout) clearTimeout(burstTimeout);
                const emojis = ['🎉', '✨', '🎊', '🥳', '🎈', '💫', '⭐', '🌈'];
                const count = 56;
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    el.className = 'burst-emoji';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 220 + Math.random() * 480;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist - 100;
                    el.style.setProperty('--tx', tx + 'px');
                    el.style.setProperty('--ty', ty + 'px');
                    el.style.setProperty('--final-opacity', 0.25 + Math.random() * 0.4);
                    el.style.setProperty('--final-scale', 0.2 + Math.random() * 0.35);
                    el.style.fontSize = (1.2 + Math.random() * 2.8) + 'rem';
                    el.style.left = (30 + Math.random() * 40) + '%';
                    el.style.top = (30 + Math.random() * 40) + '%';
                    el.style.animationDelay = (Math.random() * 0.18) + 's';
                    document.body.appendChild(el);
                }
            }

            function onComplete() {
                triggerCelebrationBurst();
                state.isCompleted = true;
                state.isPaused = true;
                state.elapsed = state.totalDuration;
                state.startTimestamp = null;
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }

                const x = 1;
                const p = calculatePerceivedProgress(1);
                renderAll(x, p);

                dom.percentWrap.classList.add('fade-out');
                dom.percentTag.classList.add('completed-centered');
                updatePauseButton();
                updatePauseVisual();
                saveState();
            }

            // ===== 添加任务 =====
            function openAddPanel() {
                dom.addPanel.classList.add('open');
                dom.taskNameInputField.value = state.taskName || '';
                dom.taskNameInputField.focus();
                dom.taskNameInputField.select();

                updateModeSelector();

                if (state.totalDuration > 0) {
                    const s = state.totalDuration;
                    if (s % 86400 === 0 && s >= 86400) { dom.durationInput.value = s / 86400;
                        dom.unitSelect.value = 'days'; } else if (s % 3600 === 0 && s >= 3600) { dom.durationInput.value =
                            s / 3600;
                        dom.unitSelect.value = 'hours'; } else if (s % 60 === 0 && s >= 60) { dom.durationInput.value = s /
                            60;
                        dom.unitSelect.value = 'minutes'; } else { dom.durationInput.value = s;
                        dom.unitSelect.value = 'minutes'; }
                } else {
                    dom.durationInput.value = 1;
                    dom.unitSelect.value = 'hours';
                }
            }

            function updateModeSelector() {
                const isLocked = state.isModeLocked;
                dom.modeSelection.classList.toggle('disabled', isLocked);
                dom.modeRadios.forEach(radio => {
                    radio.checked = (radio.value === state.feedbackMode);
                    radio.disabled = isLocked;
                });
            }

            function closeAddPanel() { dom.addPanel.classList.remove('open'); }

            function startNewTask() {
                const name = dom.taskNameInputField.value.trim() || '未命名任务';
                const num = parseFloat(dom.durationInput.value);
                const unit = dom.unitSelect.value;

                if (isNaN(num) || num <= 0) {
                    dom.durationInput.style.borderColor = '#c0392b';
                    setTimeout(() => dom.durationInput.style.borderColor = '', 800);
                    return;
                }

                let seconds = 0;
                switch (unit) {
                    case 'minutes':
                        seconds = num * 60;
                        break;
                    case 'hours':
                        seconds = num * 3600;
                        break;
                    case 'days':
                        seconds = num * 86400;
                        break;
                    case 'weeks':
                        seconds = num * 604800;
                        break;
                    default:
                        seconds = num * 3600;
                }

                if (seconds <= 0) {
                    dom.durationInput.style.borderColor = '#c0392b';
                    setTimeout(() => dom.durationInput.style.borderColor = '', 800);
                    return;
                }

                const selectedMode = document.querySelector('input[name="mode"]:checked');
                if (selectedMode) {
                    state.feedbackMode = selectedMode.value;
                } else {
                    state.feedbackMode = 'A';
                }

                state.isModeLocked = true;

                resetState();

                state.taskName = name;
                state.totalDuration = seconds;
                state.elapsed = 0;
                state.accumulatedElapsed = 0;
                state.isPaused = false;
                state.isCompleted = false;
                state.startTimestamp = Date.now();
                state.pauseTimestamp = null;

                dom.emptyState.classList.add('hidden');
                dom.ringContainer.classList.remove('hidden');

                if (state.mode === 'ring') {
                    dom.ringContainer.classList.remove('hidden');
                    dom.gridContainer.style.display = 'none';
                    dom.gridContainer.classList.remove('active');
                    dom.percentTag.style.display = 'flex';
                    dom.percentWrap.classList.remove('fade-out');
                    dom.percentTag.classList.remove('completed-centered');
                } else {
                    dom.ringContainer.classList.add('hidden');
                    dom.gridContainer.style.display = 'block';
                    dom.gridContainer.classList.add('active');
                    dom.percentTag.style.display = 'none';
                }

                updateTaskInfoDisplay();
                closeAddPanel();
                startTimer();
                saveState();

                if (dom.gridInner.children.length === 0) {
                    buildGrid();
                }
            }

            function resetState() {
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }
                state.isCompleted = false;
                state.isPaused = true;
                state.elapsed = 0;
                state.accumulatedElapsed = 0;
                state.startTimestamp = null;
                state.pauseTimestamp = null;
                dom.mainVisual.classList.remove('paused-state');
                dom.percentWrap.classList.remove('fade-out');
                dom.percentTag.classList.remove('completed-centered');
            }

            // ===== 图片生成 =====
            async function generateCapture() {
                if (typeof html2canvas === 'undefined') { alert('图片库未加载'); return; }
                const btn = dom.captureMenuBtn;
                const orig = btn.innerHTML;
                btn.innerHTML = '⏳生成中…';
                btn.style.pointerEvents = 'none';
                try {
                    document.body.classList.add('capture-mode');
                    const wrap = document.createElement('div');
                    wrap.style.cssText =
                        `position:fixed;left:-9999px;top:0;width:560px;background:#f7f6f2;padding:24px 20px 32px;z-index:-1;`;
                    const tname = state.taskName.trim() || '未命名任务';
                    const dur = state.totalDuration > 0 ? formatDuration(state.totalDuration) : '—';
                    const comp = state.isCompleted;
                    const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                    const p = calculatePerceivedProgress(x);
                    const per = formatPercent(p);
                    wrap.innerHTML = `
        <div style="border-bottom:1px solid #e8e6e0;padding-bottom:16px;margin-bottom:16px;">
            <div style="font-size:1.15rem;color:#2d2d2d;">${tname}</div>
            <div style="font-size:0.85rem;color:#8a8a8a;">${dur}</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;padding:24px 0;min-height:300px;">
        ${state.mode==='ring'?`
        <div style="width:240px;height:240px;position:relative;">
            <canvas id="capCanv" width="480" height="480" style="width:100%;height:100%;border-radius:50%;"></canvas>
            ${comp?`<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.8rem;">${per}</div>`:`<div style="position:absolute;right:-4px;bottom:-4px;font-size:0.75rem;color:#b5b5b5;">${per}</div>`}
        </div>
        `:`
        <div style="width:100%;max-width:400px;aspect-ratio:20/10;">
        <div style="display:grid;grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(10,1fr);gap:2px;height:100%;">
        ${Array.from({length:200},(_,i)=>`<div style="background:${i<Math.round(p*200)?'#5a8a9e':'#eae8e2'};aspect-ratio:1/1;border-radius:1px;"></div>`).join('')}
        </div>
        </div>
        `}
        </div>
        <div style="border-top:1px solid #e8e6e0;padding-top:12px;display:flex;justify-content:space-between;font-size:0.75rem;color:#b5b5b5;">
        <span>LogTime</span><span>${comp?'✓ 已完成':''}</span>
        </div>
        `;
                    document.body.appendChild(wrap);
                    if (state.mode === 'ring') {
                        const canv = wrap.querySelector('#capCanv');
                        const ctx = canv.getContext('2d');
                        const w = canv.width,
                            h = canv.height;
                        const cx = w / 2,
                            cy = h / 2;
                        const radius = Math.min(w, h) * 0.5 * 0.78;
                        const lw = Math.max(14, radius * 0.16);
                        ctx.clearRect(0, 0, w, h);
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = '#eae8e2';
                        ctx.lineWidth = lw;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                        const cl = Math.min(Math.max(p, 0), 1);
                        const sa = -Math.PI / 2,
                            ea = sa + Math.PI * 2 * cl;
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, sa, ea);
                        ctx.strokeStyle = '#5a8a9e';
                        ctx.lineWidth = lw;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                        if (cl >= 1) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                            ctx.strokeStyle = '#5a8a9e';
                            ctx.lineWidth = lw * 0.3;
                            ctx.globalAlpha = 0.15;
                            ctx.stroke();
                            ctx.globalAlpha = 1;
                        }
                    }
                    const canvas = await html2canvas(wrap, { scale: 2, useCORS: true, backgroundColor: '#f7f6f2',
                        logging: false });
                    document.body.removeChild(wrap);
                    document.body.classList.remove('capture-mode');

                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                    const fileName =
                        `LogTime_${tname||'task'}_${new Date().toISOString().slice(0,10)}.png`;
                    const file = new File([blob], fileName, { type: 'image/png' });

                    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
                    if (isIOS && navigator.share) {
                        try {
                            await navigator.share({ files: [file], title: fileName });
                        } catch (e) {}
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                } catch (err) {
                    console.error(err);
                    alert('生成图片失败，请重试');
                } finally {
                    btn.innerHTML = orig;
                    btn.style.pointerEvents = '';
                    document.body.classList.remove('capture-mode');
                }
            }

            // ===== 存储 =====
            function saveState() {
                try {
                    const d = {
                        taskName: state.taskName,
                        totalDuration: state.totalDuration,
                        elapsed: state.elapsed,
                        accumulatedElapsed: state.accumulatedElapsed,
                        isPaused: state.isPaused,
                        isCompleted: state.isCompleted,
                        mode: state.mode,
                        showRealTime: state.showRealTime,
                        feedbackMode: state.feedbackMode,
                        isModeLocked: state.isModeLocked,
                        version: 1,
                    };
                    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(d));
                } catch (e) { /* ignore */ }
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                    if (!raw) return false;
                    const d = JSON.parse(raw);
                    if (!d || typeof d !== 'object') return false;

                    state.taskName = d.taskName || '';
                    state.totalDuration = d.totalDuration || 0;
                    state.elapsed = d.elapsed || 0;
                    state.accumulatedElapsed = d.accumulatedElapsed || 0;
                    state.isPaused = d.isPaused !== undefined ? d.isPaused : true;
                    state.isCompleted = d.isCompleted || false;
                    state.mode = (d.mode === 'grid') ? 'grid' : 'ring';
                    state.showRealTime = d.showRealTime || false;
                    state.feedbackMode = d.feedbackMode || 'A';
                    state.isModeLocked = d.isModeLocked || false;

                    if (state.isCompleted) {
                        state.elapsed = state.totalDuration;
                        state.accumulatedElapsed = state.totalDuration;
                        state.isPaused = true;
                    }

                    if (state.totalDuration > 0 && !state.isCompleted) {
                        state.isModeLocked = true;
                    }

                    return true;
                } catch (e) { return false; }
            }

            // ===== 重置 =====
            function resetTask() {
                document.querySelectorAll('.burst-emoji').forEach(el => el.remove());
                if (burstTimeout) clearTimeout(burstTimeout);
                if (updateTimer) { clearInterval(updateTimer);
                    updateTimer = null; }

                state.taskName = '';
                state.totalDuration = 0;
                state.elapsed = 0;
                state.accumulatedElapsed = 0;
                state.isPaused = true;
                state.isCompleted = false;
                state.startTimestamp = null;
                state.pauseTimestamp = null;
                state.isModeLocked = false;

                try {
                    localStorage.removeItem(CONFIG.STORAGE_KEY);
                } catch (e) { /* ignore */ }

                dom.emptyState.classList.remove('hidden');
                dom.ringContainer.classList.add('hidden');
                dom.gridContainer.style.display = 'none';
                dom.gridContainer.classList.remove('active');
                dom.percentTag.style.display = 'none';
                dom.taskNameDisplay.textContent = '未命名任务';
                dom.taskDurationDisplay.textContent = '—';
                dom.pauseBtn.textContent = '暂停';
                dom.pauseBtn.disabled = true;
                dom.pauseBtn.classList.remove('running', 'paused', 'reset-btn');
                dom.realTimeValue.textContent = '0.0%';
                dom.percentText.textContent = '0.0%';
                dom.mainVisual.classList.remove('paused-state');
                dom.percentWrap.classList.remove('fade-out');
                dom.percentTag.classList.remove('completed-centered');
                drawRing(0);
                updateGrid(0);
                dom.menuOverlay.classList.remove('open');
                closeAddPanel();
                if (isEditing) {
                    dom.taskNameInput.classList.add('hidden');
                    dom.taskNameDisplay.classList.remove('hidden');
                    isEditing = false;
                }
                saveState();
            }

            // ===== 初始化 =====
            function init() {
                buildGrid();

                const hasSaved = loadState();

                if (hasSaved && state.totalDuration > 0) {
                    dom.emptyState.classList.add('hidden');

                    if (state.isCompleted) {
                        dom.ringContainer.classList.remove('hidden');
                        if (state.mode === 'grid') {
                            dom.ringContainer.classList.add('hidden');
                            dom.gridContainer.style.display = 'block';
                            dom.gridContainer.classList.add('active');
                            dom.percentTag.style.display = 'none';
                        } else {
                            dom.ringContainer.classList.remove('hidden');
                            dom.gridContainer.style.display = 'none';
                            dom.gridContainer.classList.remove('active');
                            dom.percentTag.style.display = 'flex';
                            dom.percentWrap.classList.add('fade-out');
                            dom.percentTag.classList.add('completed-centered');
                        }
                        const x = 1;
                        const p = calculatePerceivedProgress(1);
                        renderAll(x, p);
                        updateTaskInfoDisplay();
                        dom.pauseBtn.textContent = '重置';
                        dom.pauseBtn.classList.add('reset-btn');
                        dom.pauseBtn.disabled = false;
                        dom.mainVisual.classList.remove('paused-state');
                    } else {
                        dom.ringContainer.classList.remove('hidden');
                        if (state.mode === 'grid') {
                            dom.ringContainer.classList.add('hidden');
                            dom.gridContainer.style.display = 'block';
                            dom.gridContainer.classList.add('active');
                            dom.percentTag.style.display = 'none';
                        } else {
                            dom.ringContainer.classList.remove('hidden');
                            dom.gridContainer.style.display = 'none';
                            dom.gridContainer.classList.remove('active');
                            dom.percentTag.style.display = 'flex';
                        }

                        if (!state.isPaused) {
                            state.startTimestamp = Date.now();
                            state.accumulatedElapsed = state.elapsed;
                            startTimer();
                        } else {
                            const x = state.totalDuration > 0 ? Math.min(state.elapsed / state.totalDuration, 1) : 0;
                            const p = calculatePerceivedProgress(x);
                            renderAll(x, p);
                            dom.mainVisual.classList.add('paused-state');
                        }
                        updateTaskInfoDisplay();
                        updatePauseButton();
                    }

                    setMode(state.mode);
                    updateRealTimeVisibility();

                    document.querySelectorAll('.menu-option[data-mode] .radio').forEach(el => el.classList.remove(
                    'active'));
                    if (state.mode === 'ring') dom.modeRingRadio.classList.add('active');
                    else dom.modeGridRadio.classList.add('active');

                    state.isInitialized = true;
                    return;
                }

                dom.emptyState.classList.remove('hidden');
                dom.ringContainer.classList.add('hidden');
                dom.gridContainer.style.display = 'none';
                dom.gridContainer.classList.remove('active');
                dom.percentTag.style.display = 'none';
                dom.taskNameDisplay.textContent = '未命名任务';
                dom.taskDurationDisplay.textContent = '—';
                dom.pauseBtn.textContent = '暂停';
                dom.pauseBtn.disabled = true;
                dom.pauseBtn.classList.remove('reset-btn');

                state.mode = 'ring';
                state.showRealTime = false;
                updateRealTimeVisibility();

                document.querySelectorAll('.menu-option[data-mode] .radio').forEach(el => el.classList.remove('active'));
                dom.modeRingRadio.classList.add('active');

                state.isInitialized = true;
            }

            // ===== 事件绑定 =====
            function bindEvents() {
                // ---- 任务名称编辑 ----
                dom.taskNameDisplay.addEventListener('click', function(e) {
                    enableTaskNameEdit();
                    e.stopPropagation();
                });

                document.addEventListener('mousedown', function(e) {
                    if (isEditing) {
                        if (!dom.taskNameWrap.contains(e.target)) {
                            disableTaskNameEdit(true);
                        }
                    }
                });

                dom.taskNameInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        disableTaskNameEdit(true);
                    }
                    if (e.key === 'Escape') {
                        disableTaskNameEdit(false);
                    }
                });

                // ---- 菜单 ----
                dom.menuBtn.addEventListener('click', function() {
                    dom.menuOverlay.classList.add('open');
                });
                dom.menuClose.addEventListener('click', function() {
                    dom.menuOverlay.classList.remove('open');
                });
                dom.menuOverlay.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });

                // ---- 菜单选项: 模式 ----
                document.querySelectorAll('.menu-option[data-mode]').forEach(function(el) {
                    el.addEventListener('click', function() {
                        setMode(this.dataset.mode);
                        dom.menuOverlay.classList.remove('open');
                    });
                });

                // ---- 实际时间 toggle ----
                dom.realTimeToggle.addEventListener('click', function() {
                    state.showRealTime = !state.showRealTime;
                    updateRealTimeVisibility();
                    saveState();
                });

                // ---- 暂停 ----
                dom.pauseBtn.addEventListener('click', togglePause);

                // ---- 添加任务 ----
                dom.emptyAddBtn.addEventListener('click', openAddPanel);
                dom.cancelAddBtn.addEventListener('click', closeAddPanel);
                dom.startNowBtn.addEventListener('click', startNewTask);

                dom.taskNameInputField.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        dom.durationInput.focus();
                    }
                });
                dom.durationInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        startNewTask();
                    }
                });

                // ---- 合并信息弹窗 ----
                dom.infoBtn.addEventListener('click', function() {
                    dom.infoModal.classList.add('open');
                });
                dom.infoCloseBtn.addEventListener('click', function() {
                    dom.infoModal.classList.remove('open');
                });
                dom.infoModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });

                // ---- 图片生成 ----
                dom.captureMenuBtn.addEventListener('click', function() {
                    dom.menuOverlay.classList.remove('open');
                    generateCapture();
                });

                // ---- 重置任务 ----
                dom.resetTaskBtn.addEventListener('click', function() {
                    if (confirm('确定要重置当前任务吗？所有进度将丢失。')) {
                        resetTask();
                    }
                });

                // ---- 窗口 resize ----
                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() {
                        if (state.mode === 'ring' && !dom.ringContainer.classList.contains('hidden')) {
                            const x = state.totalDuration > 0 ? Math.min(state.elapsed / state
                                .totalDuration, 1) : 0;
                            const p = calculatePerceivedProgress(x);
                            drawRing(p);
                        }
                    }, 200);
                });

                // ---- 键盘快捷键 ----
                document.addEventListener('keydown', function(e) {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target
                        .contentEditable === 'true') return;
                    if (e.key === ' ' || e.key === 'Space') {
                        e.preventDefault();
                        if (state.totalDuration > 0) {
                            togglePause();
                        }
                    }
                    if (e.key === 'Escape') {
                        dom.menuOverlay.classList.remove('open');
                        dom.infoModal.classList.remove('open');
                        if (dom.addPanel.classList.contains('open')) {
                            closeAddPanel();
                        }
                    }
                });

                // ---- 点击外部关闭添加面板 ----
                document.addEventListener('click', function(e) {
                    if (dom.addPanel.classList.contains('open')) {
                        const panel = dom.addPanel;
                        const trigger = dom.emptyAddBtn;
                        if (!panel.contains(e.target) && !trigger.contains(e.target)) {
                            closeAddPanel();
                        }
                    }
                });
            }

            // ===== 启动 =====
            document.addEventListener('DOMContentLoaded', function() {
                init();
                bindEvents();
                if (state.totalDuration <= 0) {
                    dom.emptyState.classList.remove('hidden');
                    dom.ringContainer.classList.add('hidden');
                    dom.gridContainer.style.display = 'none';
                    dom.gridContainer.classList.remove('active');
                    dom.pauseBtn.disabled = true;
                    dom.pauseBtn.textContent = '暂停';
                    dom.pauseBtn.classList.remove('reset-btn');
                }
                if (state.mode === 'grid' && state.totalDuration > 0) {
                    dom.gridContainer.style.display = 'block';
                    dom.gridContainer.classList.add('active');
                    dom.ringContainer.classList.add('hidden');
                    dom.percentTag.style.display = 'none';
                }
                updateModeSelector();
                console.log('LogTime 已启动');
            });

            window.__TIME = {
                state,
                calculatePerceivedProgress,
                drawRing,
                updateGrid,
                togglePause,
                startNewTask,
                generateCapture,
                setMode,
                resetTask,
                enableTaskNameEdit,
                disableTaskNameEdit,
            };

        })();
    </script>
</body>
</html>
